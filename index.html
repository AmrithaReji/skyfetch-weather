<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyFetch | Modern Weather Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card" id="weather-container">
        <h1 id="app-title">SkyFetch</h1>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <div id="recent-searches" class="recent-container"></div>

        <p id="errorMessage" class="error-text"></p>

        <hr class="separator">

        <div id="current-weather">
            <h2 id="city-name">--</h2>
            <div class="weather-main">
                <img id="weather-icon" src="" alt="">
                <h3 id="temperature">--°C</h3>
            </div>
            <p id="description">--</p>
            <div class="details">
                <span>Humidity: <b id="humidity">--</b>%</span>
                <span>Wind: <b id="wind-speed">--</b> km/h</span>
            </div>
        </div>

        <div id="forecast-container" class="forecast-grid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
